<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test Interface - SSC CGL Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <!-- Header bar with Timer -->
    <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-lg font-bold text-slate-800" id="test-title">Loading Test...</h1>
        <div class="text-red-600 font-bold bg-red-50 px-3 py-1 rounded-lg border border-red-200" id="timer">Time Left: --:--</div>
    </header>

    <!-- Main Question Box -->
    <main class="flex-grow max-w-3xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-between">
        <div class="bg-white rounded-xl shadow-md p-6 space-y-6">
            <div class="flex justify-between text-sm text-slate-500">
                <span id="question-counter">Question 1 of 0</span>
            </div>
            <div id="question-text" class="text-lg font-medium text-slate-800">
                Loading question...
            </div>
            <div id="options-container" class="space-y-3">
                <!-- Options injected via JS -->
            </div>
        </div>

        <!-- Navigation buttons -->
        <div class="flex justify-between mt-6">
            <button id="prev-btn" class="bg-slate-300 text-slate-700 font-medium px-5 py-2.5 rounded-lg hover:bg-slate-400 transition">Previous</button>
            <button id="next-btn" class="bg-blue-600 text-white font-medium px-5 py-2.5 rounded-lg hover:bg-blue-700 transition">Save & Next</button>
        </div>
    </main>

    <script type="module" src="js/quiz-engine.js"></script>
</body>
</html>
